name: Causign release acceptance
on: [push, pull_request]
jobs:
  acceptance:
    name: acceptance (${{ matrix.os }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-15
            arch: arm64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - name: Verify runtime architecture
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Unexpected runtime architecture ' + process.arch); console.log(process.platform + ' ' + process.arch)"
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: 3.12.10
          architecture: ${{ matrix.arch }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check:generated
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:coverage
        env:
          CAUSIGN_PYTHON: ${{ steps.python.outputs.python-path }}
      - run: pnpm test:packed
        env:
          CAUSIGN_PYTHON: ${{ steps.python.outputs.python-path }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            coverage/
            .causign/
          if-no-files-found: ignore
          include-hidden-files: true
